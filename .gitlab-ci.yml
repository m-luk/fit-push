stages:
  - lint
  - test
  - ui
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.12-slim
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]

.install: &install
  - pip install -r requirements-dev.txt

lint:
  stage: lint
  script:
    - *install
    - ruff check --output-format=gitlab --output-file=gl-code-quality-report.json .
    - ruff format --check .
    - ty check --python "$(python -c 'import sys; print(sys.prefix)')"
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

javascript:
  stage: lint
  image: node:20-slim
  cache: []
  script:
    - for f in app/static/app.js modules/*/frontend.js; do node --check "$f"; done

# The core suite runs twice through the `client` fixture: core-only and with all modules.
test:
  stage: test
  parallel:
    matrix:
      - PY: ["3.10", "3.12", "3.13"]
  image: python:${PY}-slim
  script:
    - *install
    - python -m pytest -q --junitxml=report.xml
    - python scripts/modules.py check
  artifacts:
    when: always
    reports:
      junit: report.xml

ui-smoke:
  stage: ui
  image: mcr.microsoft.com/playwright/python:v1.49.0-noble
  script:
    - pip install -r requirements-dev.txt playwright==1.49.0
    - python .claude/skills/ui-verify/scripts/ui_smoke.py --out shots --channel bundled
    - python .claude/skills/ui-verify/scripts/ui_smoke.py --out shots-core --channel bundled --core-only --port 8791
  artifacts:
    when: always
    paths: [shots, shots-core]
    expire_in: 1 week

# ----------------------------------------------------------------------------- release
# Push a tag "vX.Y.Z" (after `python scripts/release.py bump X.Y.Z` and a commit): the desktop
# app is built for Linux and Windows, uploaded to the generic package registry and attached
# to a GitLab release. (macOS runners need a paid GitLab plan; the GitHub workflow builds macOS.)
.release-only: &release-only
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

build-linux:
  stage: build
  <<: *release-only
  image: python:3.12-bookworm  # the full image: PyInstaller needs binutils
  script:
    - python scripts/release.py check-tag "$CI_COMMIT_TAG"
    - pip install -r requirements-release.txt
    - python scripts/release.py build
    - ./dist/fit-push-*-linux-x64 --version
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build-windows:
  stage: build
  <<: *release-only
  tags: [saas-windows-medium-amd64]
  cache: []
  script:
    - choco install python312 innosetup -y --no-progress
    - $py = "C:\Python312\python.exe"
    - "& $py scripts/release.py check-tag $env:CI_COMMIT_TAG"
    - "& $py -m pip install -r requirements-release.txt"
    - "& $py scripts/release.py build --require-installer"
    - "& (Get-ChildItem dist -Filter 'fit-push-*-windows-x64.exe').FullName --version"
  artifacts:
    paths: [dist/]
    expire_in: 1 week

release:
  stage: release
  <<: *release-only
  image: python:3.12-bookworm  # has git, for the notes
  needs: [build-linux, build-windows]
  cache: []
  variables:
    GIT_DEPTH: 0  # release notes list the commits since the previous tag
  script:
    - python scripts/release.py publish-gitlab "$CI_COMMIT_TAG"
