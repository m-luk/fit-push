name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: ty check --output-format github --python "$(python -c 'import sys; print(sys.prefix)')"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: for f in app/static/app.js modules/*/frontend.js; do node --check "$f"; done

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The core suite runs twice through the `client` fixture: core-only and with all modules.
      - name: Core + modules
        run: python -m pytest -q
      - name: Module rules and generated docs
        run: python scripts/modules.py check

  ui:
    name: UI smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: With modules
        run: python .claude/skills/ui-verify/scripts/ui_smoke.py --out shots --channel bundled
      - name: Core only
        run: python .claude/skills/ui-verify/scripts/ui_smoke.py --out shots-core --channel bundled --core-only --port 8791
      - name: Guided tour
        run: python .claude/skills/ui-verify/scripts/ui_tour.py --out shots-tour --channel bundled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            shots
            shots-core
            shots-tour
          retention-days: 7
